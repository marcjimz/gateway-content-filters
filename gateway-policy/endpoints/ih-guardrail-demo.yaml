# Model-service (v2 AI Gateway endpoint) — the consolidated demo on dogfood.
# Deploy with: python tools/apply.py apply ih-guardrail-demo
name: ih-guardrail-demo
parent: bbeal.default                 # catalog.schema (UC securable parent)
destinations:
  - model: system.ai.databricks-gpt-5-5
    traffic_percentage: 100
judge: system.ai.gpt-5-2              # model_service used by the LLM-judge policies
tracing: true
usage_tracking: true
inference_table: true                 # per-endpoint payload table (full request/response for allowed traffic) — OFF by default on the platform
# Demo posture: all policies INPUT-ONLY — dogfood Beta's output-phase (post_call)
# evaluator intermittently errors on longer generations (see docs/poc-results.md).
# patient-chat keeps the strict in+out posture as the intended target once Beta stabilizes.
policies:
  - ref: healthcare-safety
    phases: [input]
    mode: enforce
  - ref: phi
    phases: [input]
    mode: enforce
  - ref: jailbreak
    phases: [input]
    mode: enforce
  - ref: pii
    phases: [input]
    mode: enforce
