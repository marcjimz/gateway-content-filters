# Research sandbox — governance-committee-approved exemption. Safety annotated.
# Prompt shields STILL block (always_block, non-negotiable).
name: research-sandbox
parent: bbeal.default
destinations:
  - model: system.ai.databricks-gpt-5-5
    traffic_percentage: 100
judge: system.ai.gpt-5-2
tracing: true
usage_tracking: true
inference_table: true                 # per-endpoint payload table — OFF by default on the platform
policies:
  - ref: healthcare-safety
    phases: [input, output]
    mode: annotate            # exemption-backed (register.yaml)
  - ref: jailbreak
    phases: [input]
    mode: enforce             # shields always block, even for exempt projects
