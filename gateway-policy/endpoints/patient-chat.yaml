# Patient-facing chatbot — strictest posture, everything enforced (blocks).
name: patient-chat
parent: bbeal.default
destinations:
  - model: system.ai.databricks-gpt-5-5
    traffic_percentage: 100
judge: system.ai.gpt-5-2
tracing: true
usage_tracking: true
inference_table: true                 # per-endpoint payload table — OFF by default on the platform
policies:
  - ref: healthcare-safety
    phases: [input, output]
    mode: enforce
  - ref: phi
    phases: [input, output]
    mode: enforce
  - ref: jailbreak
    phases: [input]
    mode: enforce
  - ref: pii
    phases: [input]
    mode: enforce
